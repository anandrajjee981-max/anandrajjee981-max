<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="100%">
  <defs>
    <linearGradient id="cyan-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#00a8ff" />
    </linearGradient>
    <linearGradient id="violet-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#c77dff" />
    </linearGradient>
    <linearGradient id="emerald-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow-light" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Panel Frame -->
  <rect width="900" height="130" rx="8" fill="#08080d" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Meter 1: AI Engine Sync -->
  <g transform="translate(30, 20)">
    <text x="0" y="14" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#00f3ff">
      ⚡ AI ENGINE ORCHESTRATION <tspan fill="#a0aec0">(LangGraph / Gemini / Mistral)</tspan>
    </text>
    <text x="390" y="14" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#00f3ff">98.5%</text>
    <!-- Background track -->
    <rect x="0" y="24" width="410" height="10" rx="3" fill="#141724" />
    <!-- Active fill -->
    <rect x="0" y="24" width="404" height="10" rx="3" fill="url(#cyan-bar)" filter="url(#glow-light)">
      <animate attributeName="width" values="360;404;390;404" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Meter 2: Full-Stack Architecture -->
  <g transform="translate(470, 20)">
    <text x="0" y="14" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#9d4edd">
      🧬 FULL-STACK ARCHITECTURE <tspan fill="#a0aec0">(React / NestJS / Postgres)</tspan>
    </text>
    <text x="390" y="14" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#9d4edd">100%</text>
    <rect x="0" y="24" width="410" height="10" rx="3" fill="#141724" />
    <rect x="0" y="24" width="410" height="10" rx="3" fill="url(#violet-bar)" filter="url(#glow-light)"/>
  </g>

  <!-- Meter 3: Real-Time & WebSockets -->
  <g transform="translate(30, 75)">
    <text x="0" y="14" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#10b981">
      📡 REAL-TIME SYSTEMS <tspan fill="#a0aec0">(Socket.io / Redis / WebGL)</tspan>
    </text>
    <text x="390" y="14" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#10b981">99.2%</text>
    <rect x="0" y="24" width="410" height="10" rx="3" fill="#141724" />
    <rect x="0" y="24" width="410" height="10" rx="3" fill="url(#emerald-bar)" filter="url(#glow-light)">
      <animate attributeName="width" values="395;407;395" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Meter 4: UI/UX Precision -->
  <g transform="translate(470, 75)">
    <text x="0" y="14" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#00f3ff">
      🎨 CYBER UI / UX ANIMATIONS <tspan fill="#a0aec0">(Tailwind / GSAP / Framer)</tspan>
    </text>
    <text x="390" y="14" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#00f3ff">100%</text>
    <rect x="0" y="24" width="410" height="10" rx="3" fill="#141724" />
    <rect x="0" y="24" width="410" height="10" rx="3" fill="url(#cyan-bar)" filter="url(#glow-light)"/>
  </g>
</svg>
