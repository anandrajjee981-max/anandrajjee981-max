<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <linearGradient id="cyan-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#00a8ff" />
    </linearGradient>
    <linearGradient id="violet-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#c77dff" />
    </linearGradient>
    <linearGradient id="emerald-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow-light" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Panel Frame -->
  <rect width="900" height="260" rx="10" fill="#07080e" stroke="#00f3ff" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Gauge 1: AI Engine Orchestration -->
  <g transform="translate(30, 22)">
    <text x="0" y="15" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#00f3ff">
      ⚡ AI ENGINE ORCHESTRATION <tspan fill="#a0aec0" font-size="11">(LangGraph / Gemini / Mistral)</tspan>
    </text>
    <text x="840" y="15" text-anchor="end" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#00f3ff">98.5%</text>
    <!-- Track -->
    <rect x="0" y="26" width="840" height="12" rx="4" fill="#121524" />
    <!-- Fill -->
    <rect x="0" y="26" width="827" height="12" rx="4" fill="url(#cyan-bar)" filter="url(#glow-light)">
      <animate attributeName="width" values="750;827;790;827" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Gauge 2: Full-Stack Architecture -->
  <g transform="translate(30, 82)">
    <text x="0" y="15" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#9d4edd">
      🧬 FULL-STACK ARCHITECTURE <tspan fill="#a0aec0" font-size="11">(React / NestJS / Postgres)</tspan>
    </text>
    <text x="840" y="15" text-anchor="end" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#9d4edd">100%</text>
    <rect x="0" y="26" width="840" height="12" rx="4" fill="#121524" />
    <rect x="0" y="26" width="840" height="12" rx="4" fill="url(#violet-bar)" filter="url(#glow-light)"/>
  </g>

  <!-- Gauge 3: Real-Time Systems -->
  <g transform="translate(30, 142)">
    <text x="0" y="15" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#10b981">
      📡 REAL-TIME SYSTEMS <tspan fill="#a0aec0" font-size="11">(Socket.io / Redis / WebGL)</tspan>
    </text>
    <text x="840" y="15" text-anchor="end" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#10b981">99.2%</text>
    <rect x="0" y="26" width="840" height="12" rx="4" fill="#121524" />
    <rect x="0" y="26" width="833" height="12" rx="4" fill="url(#emerald-bar)" filter="url(#glow-light)">
      <animate attributeName="width" values="810;833;810" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Gauge 4: Cyber UI / UX Animations -->
  <g transform="translate(30, 202)">
    <text x="0" y="15" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#00f3ff">
      🎨 CYBER UI / UX ANIMATIONS <tspan fill="#a0aec0" font-size="11">(Tailwind / GSAP / Framer)</tspan>
    </text>
    <text x="840" y="15" text-anchor="end" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#00f3ff">100%</text>
    <rect x="0" y="26" width="840" height="12" rx="4" fill="#121524" />
    <rect x="0" y="26" width="840" height="12" rx="4" fill="url(#cyan-bar)" filter="url(#glow-light)"/>
  </g>
</svg>
