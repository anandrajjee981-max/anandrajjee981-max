<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <linearGradient id="cyan-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#00a8ff" />
    </linearGradient>
    <linearGradient id="violet-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#c77dff" />
    </linearGradient>
    <linearGradient id="emerald-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow-light" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Panel Frame -->
  <rect width="900" height="320" rx="10" fill="#07080e" stroke="#00f3ff" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Gauge 1: AI Engine Orchestration -->
  <g transform="translate(0, 0)">
    <text x="30" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#00f3ff" letter-spacing="1">
      ⚡ AI ENGINE ORCHESTRATION <tspan fill="#a0aec0" font-size="11" font-weight="400">(LangGraph / Gemini / Mistral)</tspan>
    </text>
    <text x="870" y="32" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#00f3ff">98.5%</text>
    <rect x="30" y="44" width="840" height="12" rx="4" fill="#121524" />
    <rect x="30" y="44" width="827" height="12" rx="4" fill="url(#cyan-bar)" filter="url(#glow-light)">
      <animate attributeName="width" values="750;827;790;827" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Gauge 2: Full-Stack Architecture -->
  <g transform="translate(0, 75)">
    <text x="30" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#9d4edd" letter-spacing="1">
      🧬 FULL-STACK ARCHITECTURE <tspan fill="#a0aec0" font-size="11" font-weight="400">(React / NestJS / Postgres)</tspan>
    </text>
    <text x="870" y="32" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#9d4edd">100%</text>
    <rect x="30" y="44" width="840" height="12" rx="4" fill="#121524" />
    <rect x="30" y="44" width="840" height="12" rx="4" fill="url(#violet-bar)" filter="url(#glow-light)"/>
  </g>

  <!-- Gauge 3: Real-Time Systems -->
  <g transform="translate(0, 150)">
    <text x="30" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#10b981" letter-spacing="1">
      📡 REAL-TIME SYSTEMS <tspan fill="#a0aec0" font-size="11" font-weight="400">(Socket.io / Redis / WebGL)</tspan>
    </text>
    <text x="870" y="32" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#10b981">99.2%</text>
    <rect x="30" y="44" width="840" height="12" rx="4" fill="#121524" />
    <rect x="30" y="44" width="833" height="12" rx="4" fill="url(#emerald-bar)" filter="url(#glow-light)">
      <animate attributeName="width" values="810;833;810" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Gauge 4: Cyber UI / UX Animations -->
  <g transform="translate(0, 225)">
    <text x="30" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#00f3ff" letter-spacing="1">
      🎨 CYBER UI / UX ANIMATIONS <tspan fill="#a0aec0" font-size="11" font-weight="400">(Tailwind / GSAP / Framer)</tspan>
    </text>
    <text x="870" y="32" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#00f3ff">100%</text>
    <rect x="30" y="44" width="840" height="12" rx="4" fill="#121524" />
    <rect x="30" y="44" width="840" height="12" rx="4" fill="url(#cyan-bar)" filter="url(#glow-light)"/>
  </g>
</svg>
