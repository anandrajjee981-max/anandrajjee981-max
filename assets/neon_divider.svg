<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 30" width="100%" height="100%">
  <defs>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0f" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#9d4edd"/>
      <stop offset="85%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Central Laser Line -->
  <line x1="20" y1="15" x2="880" y2="15" stroke="url(#line-grad)" stroke-width="2" filter="url(#glow)"/>

  <!-- Center HUD Diamond Node -->
  <polygon points="450,7 458,15 450,23 442,15" fill="#0a0a0f" stroke="#00f3ff" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="450" cy="15" r="2.5" fill="#9d4edd">
    <animate attributeName="r" values="2;4;2" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- Left Bracket -->
  <path d="M 100 10 L 90 15 L 100 20" fill="none" stroke="#00f3ff" stroke-width="1.5" />
  <!-- Right Bracket -->
  <path d="M 800 10 L 810 15 L 800 20" fill="none" stroke="#10b981" stroke-width="1.5" />

  <!-- Animated Pulse Node travelling along line -->
  <circle cx="0" cy="15" r="3" fill="#00f3ff" filter="url(#glow)">
    <animate attributeName="cx" values="20;880;20" dur="6s" repeatCount="indefinite" />
  </circle>
</svg>
