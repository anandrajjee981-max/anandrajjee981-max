<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 20" width="100%" height="100%">
  <defs>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0f" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#9d4edd"/>
      <stop offset="80%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Central Glowing Laser Line -->
  <line x1="10" y1="10" x2="890" y2="10" stroke="url(#line-grad)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Center Diamond HUD Node -->
  <polygon points="450,4 456,10 450,16 444,10" fill="#0a0a0f" stroke="#00f3ff" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="450" cy="10" r="2" fill="#9d4edd">
    <animate attributeName="r" values="1.5;3;1.5" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- Animated Pulse Node travelling along line -->
  <circle cx="0" cy="10" r="3" fill="#00f3ff" filter="url(#glow)">
    <animate attributeName="cx" values="10;890;10" dur="5s" repeatCount="indefinite" />
  </circle>
</svg>
