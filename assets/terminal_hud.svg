<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070a" />
      <stop offset="100%" stop-color="#0f1019" />
    </linearGradient>
    <filter id="cyan-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f3ff" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Terminal Frame -->
  <rect width="900" height="240" rx="8" fill="url(#term-bg)" stroke="#9d4edd" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Terminal Window Bar -->
  <path d="M 0 8 Q 0 0 8 0 L 892 0 Q 900 0 900 8 L 900 32 L 0 32 Z" fill="#141522" stroke="#9d4edd" stroke-width="0.5" stroke-opacity="0.3"/>
  <circle cx="20" cy="16" r="5" fill="#ff5f56" />
  <circle cx="36" cy="16" r="5" fill="#ffbd2e" />
  <circle cx="52" cy="16" r="5" fill="#27c93f" />

  <text x="75" y="20" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#a0aec0">
    bash - root@anand-raj-matrix:~# systemctl status dev-core
  </text>
  <text x="830" y="20" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#00f3ff">
    [TTY-1]
  </text>

  <!-- Console Log Content -->
  <g font-family="'Fira Code', 'Courier New', monospace" font-size="12" font-weight="500">
    <!-- Log Line 1 -->
    <text x="25" y="60" fill="#718096">[0.0010] <tspan fill="#00f3ff">sys.init()</tspan> : Loading core modules...</text>
    <text x="420" y="60" fill="#10b981" font-weight="bold">[ SUCCESS ]</text>

    <!-- Log Line 2 -->
    <text x="25" y="85" fill="#718096">[0.0142] <tspan fill="#9d4edd">ai.pipelines</tspan> : Mounting Gemini, Mistral, LangGraph & LangChain...</text>
    <text x="580" y="85" fill="#10b981" font-weight="bold">[ ACTIVE ]</text>

    <!-- Log Line 3 -->
    <text x="25" y="110" fill="#718096">[0.0325] <tspan fill="#00f3ff">fullstack.stack</tspan> : NestJS, React, PostgreSQL, Docker, Socket.io...</text>
    <text x="610" y="110" fill="#00f3ff" font-weight="bold">[ READY ]</text>

    <!-- Log Line 4 -->
    <text x="25" y="135" fill="#718096">[0.0589] <tspan fill="#10b981">current.focus</tspan> : Building Autonomous AI Agents & Cyberpunk WebGL UIs</text>

    <!-- Log Line 5 -->
    <text x="25" y="160" fill="#718096">[0.0891] <tspan fill="#9d4edd">recruiter.status</tspan> : Available for Full-Stack / AI Engineer Roles</text>
    <text x="580" y="160" fill="#10b981" font-weight="bold">[ OPEN_FOR_HIRE ]</text>

    <!-- Live Command Input Line -->
    <text x="25" y="195" fill="#00f3ff" font-weight="bold">&gt; root@matrix:<tspan fill="#fff">~#</tspan> <tspan fill="#10b981">run --mode=hyper-performance --deploy=production</tspan></text>

    <!-- Animated Cursor -->
    <rect x="525" y="183" width="9" height="15" fill="#00f3ff" filter="url(#cyan-shadow)">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Bottom Accent Bar -->
  <line x1="0" y1="239" x2="900" y2="239" stroke="#00f3ff" stroke-width="2" />
</svg>
