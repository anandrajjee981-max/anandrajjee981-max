<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anand Raj | Cyberpunk Hero Card</title>
  <style>
    :root {
      --bg: #0d1117;
      --glow: #00f0ff;
      --glass: rgba(17, 25, 39, 0.75);
      --glass-border: rgba(0, 240, 255, 0.22);
      --text: #e6edf4;
      --muted: #8c98ac;
      --rope: #7e8ca0;
      --shadow: 0 40px 120px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      background: radial-gradient(circle at top, rgba(0,240,255,0.08), transparent 35%),
                  linear-gradient(180deg, #081016 0%, #0d1117 100%);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .hero-stage {
      position: relative;
      width: min(100vw, 820px);
      height: min(100vh, 720px);
      display: grid;
      place-items: center;
      overflow: visible;
    }

    .hero-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 0%, rgba(0,240,255,0.08), transparent 22%);
      mask-image: radial-gradient(circle at 50% 0%, rgba(0,0,0,1), transparent 30%);
    }

    .pendulum-wrapper {
      position: absolute;
      top: 0;
      left: 50%;
      width: 240px;
      transform: translateX(-50%);
      transform-origin: top center;
      will-change: transform;
      touch-action: none;
    }

    .pivot-point {
      position: absolute;
      top: 0;
      left: 50%;
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(145deg, #c0f7ff, #6cf8ff 60%);
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.35);
      transform: translateX(-50%);
      z-index: 5;
    }

    .rope {
      width: 2px;
      height: 138px;
      margin: 18px auto 0;
      background: linear-gradient(180deg, #d1d8e4 0%, #8c98ac 42%, #6d7689 100%);
      border-radius: 999px;
      box-shadow: inset 0 0 10px rgba(255,255,255,0.06);
      transform-origin: top center;
    }

    .card {
      position: absolute;
      top: 170px;
      left: 50%;
      width: 100%;
      max-width: 320px;
      transform: translateX(-50%);
      padding: 22px;
      border-radius: 30px;
      background: rgba(8, 15, 26, 0.78);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow), inset 0 0 0 1px rgba(0, 255, 255, 0.05);
      backdrop-filter: blur(18px);
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      will-change: transform;
    }

    .card:active {
      cursor: grabbing;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: 0 0 36px rgba(0, 240, 255, 0.2);
      opacity: 0.25;
      pointer-events: none;
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 24px;
      border: 2px solid rgba(0,255,255,0.24);
      overflow: hidden;
      flex-shrink: 0;
      background: linear-gradient(180deg, rgba(0,240,255,0.24), rgba(0,255,255,0) 68%);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-title {
      line-height: 1.05;
    }

    .card-title h1 {
      font-size: clamp(1.4rem, 2vw, 2rem);
      letter-spacing: -0.04em;
      color: #f8fdff;
    }

    .card-title p {
      margin-top: 6px;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .role {
      font-size: 0.92rem;
      letter-spacing: 0.04em;
      color: #90fcff;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .tagline {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #d8e9ff;
      padding: 16px 18px;
      border-radius: 20px;
      background: rgba(0,255,255,0.05);
      border: 1px solid rgba(0,255,255,0.08);
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.62);
      font-size: 0.88rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-align: center;
      max-width: 290px;
    }

    @media (max-width: 520px) {
      .hero-stage {
        width: 100%;
        height: 100vh;
      }

      .card {
        width: min(92vw, 320px);
      }

      .hint {
        max-width: 230px;
      }
    }
  </style>
</head>
<body>
  <main class="hero-stage">
    <section class="pendulum-wrapper" id="pendulum">
      <div class="pivot-point"></div>
      <div class="rope"></div>
      <article class="card" id="card" aria-label="Hanging ID card">
        <div class="card-top">
          <span class="avatar">
            <img src="./my.png" alt="Anand Raj avatar" onerror="this.src='https://via.placeholder.com/72x72?text=AR'" />
          </span>
          <div class="card-title">
            <h1>Anand Raj</h1>
            <p>Full-Stack + AI Engineer</p>
          </div>
        </div>
        <div class="role">Cyberpunk motion design · web systems · autonomous AI</div>
        <div class="tagline">A neon-lit pendulum ID, alive with micro-sway and interactive physics.</div>
      </article>
      <div class="hint">Drag the card sideways, then release to watch it swing.</div>
    </section>
  </main>

  <script>
    const pendulum = document.getElementById('pendulum');
    const card = document.getElementById('card');

    const state = {
      angle: 0.33,
      velocity: 0,
      dragging: false,
      pointerStartX: 0,
      pointerPrevX: 0,
      lastInteraction: performance.now(),
      idleStart: performance.now(),
      motionStart: performance.now(),
    };

    const config = {
      stiffness: 0.022,
      damping: 0.98,
      maxAngle: 0.65,
      idleDelay: 2800,
      idleAmplitude: 0.035,
      idleSpeed: 1.15,
      dragSensitivity: 0.0085,
      settleThreshold: 0.00015,
    };

    const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

    function applyTransforms(angle) {
      const degrees = angle * (180 / Math.PI);
      pendulum.style.transform = `translateX(-50%) rotate(${degrees}deg)`;
      card.style.transform = `translateX(-50%) translateY(0) rotate(${degrees}deg)`;
    }

    function updatePhysics(dt) {
      if (state.dragging) return;

      const torque = -config.stiffness * state.angle;
      state.velocity += torque * dt;
      state.velocity *= Math.pow(config.damping, dt * 60);
      state.angle += state.velocity * dt;

      if (Math.abs(state.angle) < 0.0006 && Math.abs(state.velocity) < 0.0006) {
        state.angle = 0;
        state.velocity = 0;
      }

      const now = performance.now();
      const idleAge = now - state.lastInteraction;
      if (!state.dragging && idleAge > config.idleDelay && Math.abs(state.velocity) < 0.001) {
        const idlePhase = ((now - state.idleStart) / 1000) * config.idleSpeed;
        state.angle = Math.sin(idlePhase) * config.idleAmplitude;
      }

      state.angle = clamp(state.angle, -config.maxAngle, config.maxAngle);
    }

    function animate(timestamp) {
      const dt = state.prevTimestamp ? Math.min((timestamp - state.prevTimestamp) / 16.67, 2) : 1;
      state.prevTimestamp = timestamp;

      updatePhysics(dt);
      applyTransforms(state.angle);
      requestAnimationFrame(animate);
    }

    function beginDrag(event) {
      event.preventDefault();
      if (event.pointerType === 'mouse' && event.button !== 0) return;

      state.dragging = true;
      state.pointerStartX = event.clientX;
      state.pointerPrevX = event.clientX;
      state.velocity = 0;
      state.lastInteraction = performance.now();
      state.idleStart = performance.now();

      card.setPointerCapture(event.pointerId);
      card.style.cursor = 'grabbing';
    }

    function onDrag(event) {
      if (!state.dragging) return;
      const deltaX = event.clientX - state.pointerPrevX;
      const offset = event.clientX - state.pointerStartX;
      state.angle = clamp(offset * config.dragSensitivity, -config.maxAngle, config.maxAngle);
      state.velocity = deltaX * config.dragSensitivity * 0.7;
      state.pointerPrevX = event.clientX;
      state.lastInteraction = performance.now();
      state.idleStart = performance.now();
      applyTransforms(state.angle);
    }

    function endDrag(event) {
      if (!state.dragging) return;
      state.dragging = false;
      state.lastInteraction = performance.now();
      state.idleStart = performance.now();
      card.releasePointerCapture(event.pointerId);
      card.style.cursor = 'grab';
    }

    card.addEventListener('pointerdown', beginDrag);
    card.addEventListener('pointermove', onDrag);
    card.addEventListener('pointerup', endDrag);
    card.addEventListener('pointercancel', endDrag);
    card.addEventListener('pointerleave', (event) => {
      if (state.dragging) endDrag(event);
    });

    window.addEventListener('blur', () => { state.dragging = false; });
    window.addEventListener('resize', () => { state.lastInteraction = performance.now(); });

    requestAnimationFrame(animate);
  </script>
</body>
</html>
